<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWARM//OPS - test bench</title>
  <link rel="stylesheet" href="css/bench.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand"><span class="logo">SWARM<b>//</b>OPS</span><span class="sub">test bench</span></div>
      <nav id="tabs">
        <button data-tab="recon"><i>01</i>RECON</button>
        <button data-tab="defence"><i>02</i>DEFENCE</button>
        <button data-tab="offence"><i>03</i>OFFENCE</button>
        <button data-tab="train"><i>04</i>TRAIN</button>
      </nav>
      <div class="right">
        <span id="jobstate" class="jobstate" title="background work"></span>
        <button id="btn-brains" class="ghost">BRAINS</button>
        <button id="btn-help" class="ghost" title="manual">?</button>
        <button id="btn-power" class="ghost power" title="shut the studio down">&#x23FB;</button>
      </div>
    </header>

    <main id="main">
      <aside id="setup" class="panel"></aside>

      <section id="stage">
        <div id="view" class="view">
          <canvas id="gl"></canvas>
          <div id="labels"></div>
          <div id="hud"></div>
          <div id="ticker"></div>
          <div id="legend"></div>
          <div id="empty" class="empty"></div>
        </div>
        <div id="playbar">
          <button id="pb-play" class="icon" title="play / pause (space)">&#9654;</button>
          <input id="pb-scrub" type="range" min="0" max="0" value="0" step="1">
          <span id="pb-time">00:00 / 00:00</span>
          <div id="pb-speed" class="seg"></div>
          <label class="tog"><input id="pb-links" type="checkbox" checked> radio</label>
          <label class="tog"><input id="pb-locks" type="checkbox" checked> intent</label>
        </div>
      </section>

      <aside id="results" class="panel"></aside>
    </main>
  </div>

  <div id="drawer" class="drawer">
    <div class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button id="drawer-close" class="ghost">CLOSE</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div id="modal-foot"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <input id="file" type="file" accept=".py,.npz,.zip" hidden>

  <div id="offline" class="offline">
    <div><b>STUDIO OFFLINE</b><p id="offline-msg">The studio server has stopped. Start it again with
      <code>python -m swarm.studio</code>.</p></div>
  </div>
</body>
</html>
