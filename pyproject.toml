[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-balancer"
version = "0.1.0"
description = "Design, train, simulate and stress-test workload-redistributing AI swarms (satellites, drones, ...)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=44"]
deploy = ["cryptography>=44"]

[project.scripts]
swarm-worker = "swarm.runtime.cli:main"
swarm-deploy = "swarm.deploy.cli:main"
swarm-setup = "swarm.deploy.setup:main"
swarm-studio = "swarm.studio.server:main"
swarm-sdk = "swarm.sdk.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"swarm.studio" = ["static/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-q"
